<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Serviço')}">
        <meta charset="UTF-8">
</head>

<body>
<header th:replace="~{fragments/layout :: topo}"></header>
<section th:replace="~{fragments/layout :: hero(${nomeServico})}"></section>

<main>
    <div class="container">
        <div class="cartao">
            <ol th:replace="~{fragments/layout :: passos(1)}"></ol>

            <p class="dica" th:if="${candidatos.isEmpty()}">
                Digite o nome do serviço acima e escolha uma das opções da lista.
            </p>

            <div th:unless="${candidatos.isEmpty()}">
                <h2>Encontramos mais de um serviço. Escolha o seu:</h2>
                <table>
                    <thead><tr><th>Serviço</th></tr></thead>
                    <tbody>
                    <tr th:each="s : ${candidatos}">
                        <td>
                            <a class="tabela-link"
                               th:href="@{/servicos/detalhes(nome=${s.nomeServico}, digitado=${nomeServico})}"
                               th:text="${s.nomeServico}">ELETRICISTA</a>
                        </td>
                    </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
