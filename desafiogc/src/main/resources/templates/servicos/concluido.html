<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho(${titulo})}">
    <meta charset="UTF-8">
</head>
<body>
<header th:replace="~{fragments/layout :: topo('consulta')}"></header>
<section th:replace="~{fragments/layout :: hero(${nomeServico})}"></section>

<main>
    <div class="container">
        <div class="cartao">
            <ol class="passos">
                <li class="feito"><b>1</b> Serviço</li>
                <li class="feito"><b>2</b> Adicionais</li>
                <li class="feito"><b>3</b> Confirmar</li>
            </ol>

            <h2 th:text="${titulo}">Serviço confirmado</h2>
            <p style="font-size:1.4rem;font-weight:700;margin:0 0 8px" th:text="${servicoNome}"></p>
            <p class="nota" th:text="${mensagem}">Mensagem</p>

            <p class="nota" th:if="${medida != null}">Unidade de medida: <b th:text="${medida}">H - Hora</b></p>

            <span class="rotulo" th:unless="${itens.isEmpty()}">Adicionais marcados</span>
            <ul class="resumo-ad" th:unless="${itens.isEmpty()}">
                <li th:each="item : ${itens}" th:text="${item}">Hora extra</li>
            </ul>

            <a class="acao sec acao-link" th:href="@{/servicos}">Nova consulta</a>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
