<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Login')}"></head>

<body>
<header th:replace="~{fragments/layout :: topo}"></header>
<main class="login-pagina">
    <div class="login-cartao">
        <span class="login-logo">GERDAU</span>  <!-- <img src="img/gerdau-logo.svg" alt="Gerdau"> -->
        <h1>Entrar no sistema</h1>
        <p class="login-sub">Use seu usuário e senha para acessar o catálogo.</p>

        <!-- aparece quando a URL for /login?error -->
        <p class="alerta" th:if="${param.error}">Usuário ou senha incorretos. Tente de novo.</p>

        <form method="post" th:action="@{/login}">
            <div class="login-campo">
                <label class="rotulo" for="usuario">Usuário</label>
                <input class="campo" type="text" id="usuario" name="username" autocomplete="username" required autofocus>
            </div>
            <div class="login-campo">
                <label class="rotulo" for="senha">Senha</label>
                <div class="senha-wrap">
                    <input class="campo" type="password" id="senha" name="password" autocomplete="current-password" required>
                    <button type="button" class="senha-mostrar" id="mostrarSenha">Mostrar</button>
                </div>
            </div>
            <button type="submit" class="acao">Entrar</button>
        </form>

        <p class="login-ajuda">Problemas para acessar? Fale com o administrador do sistema.</p>
    </div>
</main>
</body>
