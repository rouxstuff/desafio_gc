<!DOCTYPE html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragments/layout :: cabecalho('Catálogo')}">
    <meta charset="UTF-8">
</head>
<body>
<header th:replace="~{fragments/layout :: topo('catalogo')}"></header>
<section th:replace="~{fragments/layout :: heroSimples('Catálogo de serviços', 'Serviços aprovados. Os novos só aparecem aqui depois que o administrador aprovar.')}"></section>

<main>
    <div class="container">
        <div class="cartao">
            <form class="filtro" method="get" th:action="@{/catalogo}">
                <input class="campo" type="text" name="q" th:value="${q}" placeholder="Filtrar pelo nome…" aria-label="Filtrar pelo nome" autocomplete="off">
                <button type="submit" class="acao sec">Filtrar</button>
                <a th:if="${!q.isEmpty()}" th:href="@{/catalogo}" class="tabela-link">Limpar</a>
            </form>

            <p class="dica" th:if="${servicos.isEmpty()}">Nenhum serviço encontrado.</p>

            <div class="tabela-rolagem"><table th:unless="${servicos.isEmpty()}">
                <thead>
                <tr><th>Código</th><th>Serviço</th><th>Categoria</th><th>Unidade de medida</th><th>Status</th></tr>
                </thead>
                <tbody>
                <tr th:each="s : ${servicos}">
                    <td class="codigo" th:text="${s.codigoServico}">4096348</td>
                    <td>
                        <a class="tabela-link" th:href="@{/servicos/detalhes(codigo=${s.codigoServico})}"
                           th:text="${s.nomeServico}">AJUDANTE</a>
                    </td>
                    <td th:text="${s.categoria != null ? s.categoria.categoriaNome : '—'}">CIVIL</td>
                    <td th:text="${s.unidadeMedida != null ? s.unidadeMedida.codigo : '—'}">H</td>
                    <td><span class="selo" th:classappend="${s.status.name().toLowerCase()}" th:text="${s.status}">APROVADO</span></td>
                </tr>
                </tbody>
            </table></div>

            <p class="nota" th:unless="${servicos.isEmpty()}"
               th:text="${total + ' serviço(s) · página ' + (paginaAtual + 1) + ' de ' + totalPaginas}"></p>
            <div class="paginacao" th:if="${totalPaginas > 1}">
                <a th:if="${paginaAtual > 0}" class="tabela-link" th:href="@{/catalogo(q=${q}, pagina=${paginaAtual - 1})}">‹ Anterior</a>
                <a th:if="${paginaAtual + 1 < totalPaginas}" class="tabela-link" th:href="@{/catalogo(q=${q}, pagina=${paginaAtual + 1})}">Próxima ›</a>
            </div>
        </div>
    </div>
</main>

<footer th:replace="~{fragments/layout :: rodape}"></footer>
</body>
</html>
