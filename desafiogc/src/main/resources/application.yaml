spring:
  application:
    name: desafiogc
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 5
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        jdbc:
          batch_size: 50
        order_inserts: true
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 20MB

app:
  # true = cria fornecedores, serviços e vínculos FICTÍCIOS de demonstração (só em banco vazio)
  seed-demo: ${APP_SEED_DEMO:false}
